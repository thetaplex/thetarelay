[project]
name = "thetarelay"
version = "0.2.0"
description = "Routing proxy for coding agents: a local judge sends easy requests to a local model and hard ones to a frontier model"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "ThetaPlex", email = "support@thetaplex.com" }]
requires-python = ">=3.13"
keywords = [
    "model-routing",
    "coding-agent",
    "headroom",
    "claude-code",
    "opencode",
    "ollama",
    "proxy",
    "llm",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "httpx>=0.25.0",
]

[project.urls]
Homepage = "https://github.com/thetaplex/thetarelay"
Repository = "https://github.com/thetaplex/thetarelay"
Issues = "https://github.com/thetaplex/thetarelay/issues"
Changelog = "https://github.com/thetaplex/thetarelay/blob/main/CHANGELOG.md"

[project.optional-dependencies]
headroom = [
    "headroom-ai>=0.30.0",
]

[dependency-groups]
dev = [
    "mypy>=1.16",
    "pytest>=8.4",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.12",
]

[project.scripts]
thetarelay = "thetarelay.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thetarelay"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PT", "PTH", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"scripts/**" = ["S311", "S603", "S607"]
"scripts/app_eval/{hidden_tests,reference}/**" = ["S101", "B008"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["headroom.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["-ra", "--strict-markers", "--strict-config"]
testpaths = ["tests"]
xfail_strict = true
