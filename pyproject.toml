[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "thetacode"
version = "0.1.0"
description = "Speculative local-to-frontier drafting proxy & Headroom extension for coding agents (Pi, OpenCode, Cursor, Claude Code)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
]

[project.optional-dependencies]
headroom = [
    "headroom-ai>=0.30.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
thetacode = "thetacode.cli:main"

[project.entry-points."headroom.proxy_extension"]
thetacode = "thetacode.headroom_ext:install"

[tool.hatch.build.targets.wheel]
packages = ["src/thetacode"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
