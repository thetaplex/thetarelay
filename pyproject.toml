[project]
name = "thetarelay"
version = "0.1.0"
description = "Local-to-Frontier Speculative Drafting Proxy & Headroom Extension for Coding Agents (Pi, OpenCode, Cursor, Claude Code)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "ThetaPlex", email = "support@thetaplex.com" }]
requires-python = ">=3.13"
keywords = [
    "speculative-decoding",
    "coding-agent",
    "headroom",
    "claude-code",
    "opencode",
    "ollama",
    "proxy",
    "llm",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "httpx>=0.25.0",
]

[project.urls]
Homepage = "https://github.com/thetaplex/thetarelay"
Repository = "https://github.com/thetaplex/thetarelay"
Issues = "https://github.com/thetaplex/thetarelay/issues"
Changelog = "https://github.com/thetaplex/thetarelay/blob/main/CHANGELOG.md"

[project.optional-dependencies]
headroom = [
    "headroom-ai>=0.30.0",
]

[dependency-groups]
dev = [
    "mypy>=1.16",
    "pytest>=8.4",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.12",
]

[project.scripts]
thetarelay = "thetarelay.cli:main"

# Native plugin registration for `headroom proxy --proxy-extension thetarelay`
[project.entry-points."headroom.proxy_extension"]
thetarelay = "thetarelay.headroom_ext:install"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thetarelay"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PT", "PTH", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["headroom.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["-ra", "--strict-markers", "--strict-config"]
testpaths = ["tests"]
xfail_strict = true
